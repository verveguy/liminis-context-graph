[workspace]
members = ["crates/core", "crates/service", "crates/eval"]
resolver = "2"

[workspace.package]
version = "0.14.1"
repository = "https://github.com/verveguy/liminis-context-graph"

# Strip debuginfo from dev/test builds. Linking the ~50 integration-test
# binaries (crates/core: 37, crates/service: 11, crates/eval: 2 — see #316)
# against the full lbug static archive (+ third-party deps) with default
# `debug = "full"` blows the 7GB Ubuntu CI runner's RAM during `ld` and
# triggers "collect2: fatal error: ld terminated with signal 7".
# We don't need debug symbols on CI; if a dev wants them locally they can
# override with `RUSTFLAGS="-C debuginfo=2"`.
[profile.dev]
debug = "line-tables-only"

[profile.dist]
inherits = "release"
strip = "debuginfo"

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
installers = ["shell"]
# Build the platform artifacts on pull requests, not only on tags. Without this,
# `build-local-artifacts` is gated off for PRs and the release path is exercised
# for the first time by the tag itself — which is exactly how ADR-0398's static
# OpenSSL link shipped unverified (no release before v0.14.0 ever ran either
# OpenSSL script, because every tag through v0.13.4 pinned lbug 0.17.0 with
# OpenSSL still bundled), and how four separate macOS linkage defects each cost a
# tag-and-delete cycle to discover. ci.yml cannot cover this: it is ubuntu-only,
# and scripts/stage-openssl-rpath.sh is a no-op on Linux. Costs three extra
# platform builds per code-touching PR; cheap against a failed release.
pr-run-mode = "upload"
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
# .lbdb: the bundled lbug vector/fts extension binaries staged per-target by
# scripts/stage-lbug-extensions.sh (invoked from .github/build-setup.yml before `dist build`
# runs) — see issue #559 / ADR-0559. Flat list, applies identically to every target's archive,
# same as the other three entries; per-target content differs because each matrix job stages
# only its own platform's files into this path before packaging.
include = ["LICENSE", "README.md", "CHANGELOG.md", ".lbdb"]
# Lives at .github/build-setup.yml (one level up from .github/workflows/, where
# cargo-dist resolves this path). Kept OUT of .github/workflows/ so GitHub does
# not try to run the bare steps-fragment as a workflow and post an
# "Invalid workflow file" failure on every push.
github-build-setup = "../build-setup.yml"
# allow-dirty suppresses "release.yml out of date" errors from dist plan/generate.
# The cache/restore step in build-setup.yml was patched to use a YAML literal block
# scalar (|) for the multi-line path — cargo-dist's YAML emitter writes continuation
# lines at column 0, which is invalid YAML. This fix is correct; allow-dirty = ci
# preserves it across future dist generate runs.
allow-dirty = ["ci"]

[workspace.metadata.dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
# x86_64 pinned to 24.04 (GCC 13+): lbug's headers use the C++20 <format>
# header, absent from cargo-dist's default ubuntu-22.04 (GCC 11). The v0.9.0
# release x86_64 build failed with `fatal error: format: No such file or
# directory`. arm64 already used 24.04-arm and built fine. Still required at
# 0.20.1 — build.rs compiles the cxx bridges at C++20 regardless of the
# prebuilt path, since that is a local compile of the FFI bridge rather than
# of the downloaded engine.
x86_64-unknown-linux-gnu = "ubuntu-24.04"

[workspace.metadata.dist.dependencies.apt]
cmake = "*"
ninja-build = "*"
# lbug 0.18.0 moved OpenSSL out of the prebuilt fat bundle
# (LadybugDB/ladybug#590), so liblbug.a now needs libssl/libcrypto at link
# time. Declared rather than assumed present, for the same determinism reason
# cmake and ninja-build are. libssl-dev also supplies the libssl.a/libcrypto.a
# headers and libraries lbug's build.rs links against. OpenSSL is linked
# dynamically and supplied by the user at runtime — see ADR-0550.
libssl-dev = "*"

[workspace.metadata.dist.dependencies.homebrew]
# The macOS half of the same requirement. scripts/stage-openssl-rpath.sh
# resolves the keg via `brew --prefix openssl@3` and copies its dylibs to
# rewrite their install_name to @rpath; declaring it here means cargo-dist's
# "Install dependencies" step guarantees the keg rather than depending on
# whatever the runner image ships. The staging step runs immediately after that
# install in release.yml — see ADR-0550.
"openssl@3" = "*"
# pkg-config is how lbug's build.rs discovers the staged static archives
# (scripts/stage-openssl-rpath.sh publishes a .pc pointing at the @rpath-staged
# dylibs). Declared rather than assumed: if pkg-config is absent, lbug 0.20.1's
# build.rs falls through to its hardcoded macOS probe paths and bakes the build
# runner's absolute Homebrew path into the binary. See ADR-0550 and issue #550.
"pkg-config" = "*"

[workspace.dependencies]
arc-swap = "1"
lbug = "=0.18.1"
thiserror = "2"
tempfile = "3"
regex = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
futures = "0.3"
serde_yaml = "0.9"
sha2 = "0.10"
tokio-util = "0.7"
rmcp = { version = "2.2.0", default-features = false, features = ["server", "transport-io"] }
