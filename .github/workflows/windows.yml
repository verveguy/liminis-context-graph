name: Windows

# Windows build + transport coverage (issue #581). Kept out of ci.yml on purpose: that workflow's
# job graph (build-release artifacts, lbug cache ownership, the docs-only classifier feeding the
# required `test (ubuntu-latest)` check) is Linux-shaped, and this job shares none of it. Not a
# required check unless branch protection is changed to make it one.
#
# What it proves on x86_64-pc-windows-msvc:
# - the workspace lints clean under -D warnings (Windows-only cfg arms included);
# - lcg-service's unit tests, including the named-pipe transport (owner-only DACL, first-instance
#   refusal, round trip);
# - socket_service_e2e: the real binary serving JSON-RPC over the named pipe, discovered via
#   .lcg/service.endpoint, through health_check -> knowledge_status -> knowledge_close.
#
# lcg-core's suite also passes on Windows (verified on a real machine for #581) but is not run
# here yet: it roughly doubles the job time, and it has no Windows-specific code paths.

on:
  pull_request:
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "LBUG_EXTENSION_VERSION"
      - "scripts/stage-openssl-windows.sh"
      - "scripts/stage-lbug-extensions.sh"
      - ".github/workflows/windows.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  # Static, as release builds link it (ADR-0581): what CI tests is what ships.
  OPENSSL_TRIPLET: x64-windows-static-md
  # Dynamic triplet, only for the two DLLs lbug's win_amd64 extensions import (ADR-0581).
  OPENSSL_DLL_TRIPLET: x64-windows

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # vcpkg ships on the runner image; building openssl from source takes several
      # minutes, so cache the installed tree keyed on the vcpkg checkout it was built with.
      - name: Get vcpkg commit for cache key
        id: vcpkg
        run: echo "commit=$(git -C "$VCPKG_INSTALLATION_ROOT" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore OpenSSL (vcpkg) from cache
        id: openssl-cache
        uses: actions/cache@v6
        with:
          key: vcpkg-openssl-${{ env.OPENSSL_TRIPLET }}-${{ steps.vcpkg.outputs.commit }}
          path: ${{ env.VCPKG_INSTALLATION_ROOT }}/installed/${{ env.OPENSSL_TRIPLET }}

      - name: Build OpenSSL (vcpkg)
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: '"$VCPKG_INSTALLATION_ROOT/vcpkg" install "openssl:$OPENSSL_TRIPLET"'

      # lbug's build.rs asks MSVC for ssl.lib/crypto.lib; stage renamed static libs onto LIB and
      # export LINK with the Windows system libraries static OpenSSL needs. See the script's header.
      # No OPENSSL_DIR: its only reader, openssl-sys, is not built for the MSVC target (native-tls
      # uses SChannel on Windows), so this job now configures OpenSSL exactly as release.yml does.
      - name: Stage OpenSSL for the MSVC linker
        run: bash scripts/stage-openssl-windows.sh "$VCPKG_INSTALLATION_ROOT/installed/$OPENSSL_TRIPLET"

      - name: Restore lbug extension bundle from cache
        id: lbug-ext-cache
        uses: actions/cache@v6
        with:
          key: lbug-extension-bundle-win_amd64-${{ hashFiles('LBUG_EXTENSION_VERSION', 'LBUG_EXTENSION_HASHES') }}
          path: lbug-extension-bundle

      - name: Stage lbug vector/fts extensions (win_amd64)
        if: steps.lbug-ext-cache.outputs.cache-hit != 'true'
        run: bash scripts/stage-lbug-extensions.sh win_amd64 lbug-extension-bundle

      - name: Restore dynamic OpenSSL (vcpkg) from cache
        id: openssl-dll-cache
        uses: actions/cache@v6
        with:
          key: vcpkg-openssl-${{ env.OPENSSL_DLL_TRIPLET }}-${{ steps.vcpkg.outputs.commit }}
          path: ${{ env.VCPKG_INSTALLATION_ROOT }}/installed/${{ env.OPENSSL_DLL_TRIPLET }}

      - name: Build dynamic OpenSSL (vcpkg) for the extension DLLs
        if: steps.openssl-dll-cache.outputs.cache-hit != 'true'
        run: '"$VCPKG_INSTALLATION_ROOT/vcpkg" install "openssl:$OPENSSL_DLL_TRIPLET"'

      # lbug's extension DLLs import libssl-3-x64.dll/libcrypto-3-x64.dll; ship them in the bundle,
      # exactly as release.yml does, so CI exercises the same resolution lcg relies on.
      - name: Bundle OpenSSL DLLs beside the lbug extensions
        run: bash scripts/stage-openssl-dlls-windows.sh "$VCPKG_INSTALLATION_ROOT/installed/$OPENSSL_DLL_TRIPLET" lbug-extension-bundle

      - name: Point Db::open at the staged extensions
        run: echo "LCG_LBUG_HOME=$(cygpath -w "$PWD/lbug-extension-bundle")" >> "$GITHUB_ENV"

      - name: Clippy (lcg-core, lcg-service; all targets)
        run: cargo clippy -p lcg-core -p lcg-service --all-targets -- -D warnings

      - name: lcg-service unit tests (incl. named-pipe transport)
        run: cargo test -p lcg-service --bin liminis-context-graph

      # Run the e2e with a PATH *built from an allowlist*, not filtered from the inherited one. The
      # inherited runner PATH is actively hostile to this test: several unrelated tools on it ship
      # their own libssl-3-x64.dll / libcrypto-3-x64.dll, and any of them silently satisfies the lbug
      # extensions' OpenSSL imports, making the e2e pass without proving the bundled DLLs work (#581).
      # Seen so far: Git for Windows' mingw64\bin and usr\bin (hid the original bug locally), and
      # C:\Program Files\MySQL\MySQL Server 8.0\bin on the windows-latest image (caught by the
      # assertion below on this PR's first CI run). A blocklist of such directories is unbounded,
      # so the step keeps only what it needs: the Rust toolchain and the Windows system directories.
      # rustc locates link.exe itself (vswhere/registry), and the earlier clippy/test steps have
      # already run every build script, so nothing else is required here. The assertion stays as a
      # second guard: a pass must mean the bundle resolved the DLLs.
      - name: Socket service end-to-end over the named pipe (no OpenSSL DLL on PATH)
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $env:Path = @(
            (Join-Path $cargoHome 'bin'),
            "$env:SystemRoot\System32",
            $env:SystemRoot,
            "$env:SystemRoot\System32\Wbem",
            "$env:SystemRoot\System32\WindowsPowerShell\v1.0",
            (Split-Path -Parent (Get-Process -Id $PID).Path)
          ) -join ';'
          Write-Host "PATH for this step: $env:Path"
          foreach ($dll in 'libssl-3-x64.dll', 'libcrypto-3-x64.dll') {
            $found = (Get-Command $dll -ErrorAction SilentlyContinue).Source
            if ($found) { throw "$dll is still resolvable on PATH at $found — the e2e would not prove the bundle" }
          }
          cargo --version
          cargo test -p lcg-service --test socket_service_e2e

      - name: Assert the service binary imports no OpenSSL DLL
        run: bash scripts/assert-openssl-linkage.sh target/debug/liminis-context-graph.exe
