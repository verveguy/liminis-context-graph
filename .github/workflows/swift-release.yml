name: Swift sidecar release

# Manually-triggered build + publish of the native/local-inference/ Swift sidecar
# (LocalInference binary) as a GitHub Release asset, so verveguy/liminis can obtain
# a binary built from this repo's source without vendoring the Swift source itself.
# See ADR-0503.
#
# Deliberately workflow_dispatch-only, not tag-push-triggered: release.yml (autogenerated
# by cargo-dist) already triggers on any tag matching '**[0-9]+.[0-9]+.[0-9]+*' — a glob
# that matches a digit.digit.digit substring anywhere in the tag, regardless of prefix. A
# dotted semver-style tag picked for a sidecar release would silently also trigger (and
# fail) the Rust release workflow. This workflow's own release tags use an undotted
# `local-inference-v<integer>` scheme for the same reason — see the "package" step below.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version integer (tag will be local-inference-v<version>). Defaults to the run number.'
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    working-directory: native/local-inference

jobs:
  build-and-release:
    name: build + release (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Verify Swift 6.2+ toolchain
        run: |
          VERSION_LINE=$(swift --version 2>&1 | grep -o 'Swift version [0-9]*\.[0-9]*' | head -1)
          MAJOR=$(echo "$VERSION_LINE" | awk '{print $3}' | cut -d. -f1)
          MINOR=$(echo "$VERSION_LINE" | awk '{print $3}' | cut -d. -f2)
          if [ "$MAJOR" -lt 6 ] || { [ "$MAJOR" -eq 6 ] && [ "$MINOR" -lt 2 ]; }; then
            echo "::error::Runner's Swift toolchain ($VERSION_LINE) is older than the required 6.2 — this workflow needs a macos-latest image that has rolled forward to macOS 26 + Swift 6.2. See ADR-0503."
            exit 1
          fi

      - name: swift build -c release
        run: swift build -c release

      - name: swift test
        run: swift test

      - name: Package binary
        id: package
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.run_number }}"
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+$'; then
            echo "::error::version input must be a plain integer with no dots (got '$VERSION') — a dotted value would make the release tag match release.yml's digit.digit.digit trigger glob and collide with the Rust release workflow. See ADR-0503."
            exit 1
          fi
          TAG="local-inference-v${VERSION}"
          ARCHIVE="local-inference-aarch64-apple-macos.tar.gz"

          mkdir -p dist
          cp .build/release/LocalInference dist/local-inference
          tar -czf "$ARCHIVE" -C dist local-inference
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.package.outputs.tag }}" \
            --title "local-inference ${{ steps.package.outputs.tag }}" \
            --notes "Swift sidecar (LocalInference) built from $(git rev-parse HEAD) on macos-latest. See native/local-inference/README.md for how verveguy/liminis consumes this artifact." \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256"
