name: Perf Benchmarks

on:
  workflow_dispatch:
    inputs:
      measurement_time:
        description: 'Criterion measurement time in seconds (per bench)'
        required: false
        default: '30'

  # Uncomment the block below to enable nightly perf tracking (P3 optional feature).
  # schedule:
  #   - cron: '0 2 * * *'  # 02:00 UTC every night

# See ci.yml's `defaults:` block for why this is here: without an explicit `shell: bash`,
# GitHub's implicit default shell has no `pipefail`, so the `cargo bench ... | tee` steps
# below would report `tee`'s exit status, not `cargo bench`'s. #430.
defaults:
  run:
    shell: bash

jobs:
  bench:
    name: bench (ubuntu-latest)
    runs-on: ubuntu-latest
    # LBUG_BUILD_FROM_SOURCE removed: the lbug prebuilt is a fat bundle (no longer
    # fully self-contained — OpenSSL links externally since 0.18.0).
    # Source builds cause 7399 duplicate-symbol linker errors. See LadybugDB/ladybug-rust#18.
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: compile bench binaries
        run: cargo bench --no-run

      - name: dedup bench 1k
        env:
          MEASUREMENT_TIME: ${{ inputs.measurement_time || '30' }}
        run: |
          cargo bench --bench dedup_search -- 1k --measurement-time "$MEASUREMENT_TIME" \
            2>&1 | tee bench-1k.txt

      - name: dedup bench 10k
        env:
          MEASUREMENT_TIME: ${{ inputs.measurement_time || '30' }}
        run: |
          cargo bench --bench dedup_search -- 10k --measurement-time "$MEASUREMENT_TIME" \
            2>&1 | tee bench-10k.txt

      - name: dedup bench 50k
        env:
          MEASUREMENT_TIME: ${{ inputs.measurement_time || '30' }}
        run: |
          cargo bench --bench dedup_50k -- --measurement-time "$MEASUREMENT_TIME" \
            2>&1 | tee bench-50k.txt

      - name: upload bench results (text)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results-${{ github.sha }}
          path: |
            bench-1k.txt
            bench-10k.txt
            bench-50k.txt
          retention-days: 30

      - name: upload criterion HTML reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: criterion-html-${{ github.sha }}
          path: target/criterion/
          retention-days: 30
