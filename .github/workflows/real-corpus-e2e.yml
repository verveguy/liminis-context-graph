name: Real-Corpus E2E

# The real_corpus_e2e tests (crates/core/tests/real_corpus_e2e.rs, #217) are #[ignore]d out
# of the default `cargo test --release` run: a full WAL replay + HNSW/FTS index build over
# the golden fixture's 1,506 entities takes roughly a minute each, and this file runs three
# of them (~190-240s / 3-4 min total, see crates/core/tests/fixtures/real_corpus_wal/README.md
# for the measured figure) — adding that to every PR's `test` job would be a material tax on
# a repo with several issues often in flight at once. (Note: `cargo test --release` itself is
# only ~5 min of that job; the ~15-18 min total predating #316 was dominated by a Criterion
# bench-harness footgun in the R-003 gate, since fixed — see ADR-0316.)
#
# Per #328: these five jobs also now run in parallel on code-touching PRs (gated by the
# same shared classifier ci.yml uses, see the `changes` job below), reporting but not
# gating — the suite's own wall clock (~9 min) finishes well before the required `test
# (ubuntu-latest)` check (~17-20 min), so this is expected to add zero latency to a PR's
# time-to-mergeable. See docs/adr/0328-real-corpus-e2e-on-pr-path.md for the full
# rationale, the cache-race analysis, and the promotion-to-required criteria.
#
# This still runs on every push to main (post-merge verification, before a regression
# reaches a release) and supports workflow_dispatch for manual runs during development —
# both unchanged from before #328.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: real-corpus-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LBUG_CACHE_BUST: "2026-07-13"

jobs:
  # Shared classifier (see docs/adr/0322-ci-docs-only-fast-path.md,
  # docs/adr/0328-real-corpus-e2e-on-pr-path.md) — same composite action ci.yml's
  # `changes` job calls, so there is exactly one deny-list, not two independently
  # maintained copies (FR-003/SC-005). The extra-deny-pattern below additionally treats
  # a change to the golden real-corpus WAL fixture as code-relevant even though its
  # files (.json/.jsonl/.yaml) don't match the base pattern (Edge Cases).
  # Scoped to `pull_request` only: the composite action always short-circuits to
  # code_changed=true for any other event (push/workflow_dispatch), so running it there
  # would just add a checkout + action invocation for no behavioral benefit. The five
  # e2e jobs' existing fail-safe `if:` (`needs.changes.result != 'success' || ...`)
  # already treats a skipped `changes` job the same as a non-code-changed-classified
  # one — defaulting to "run" — so skipping this job on non-PR events is safe.
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Classify diff (docs-only vs code-touching)
        id: classify
        uses: ./.github/actions/classify-changes
        with:
          extra-deny-pattern: "^crates/core/tests/fixtures/real_corpus_wal/"

  real-corpus-e2e:
    name: real_corpus_e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: changes
    # Same fail-safe pattern as ci.yml's build-lbug/test: a failed `changes` job (not
    # just a code_changed=false result) must never silently skip this — see
    # docs/adr/0322-ci-docs-only-fast-path.md Decision 3.
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code_changed == 'true')"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Get rustc version for cache key
        id: rustc-ver
        run: echo "version=$(rustc --version | sha256sum | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Get lbug version hash for cache key
        id: lbug-hash
        run: echo "hash=$(grep -A12 '^name = "lbug"$' Cargo.lock | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Same cache key as ci.yml's build-lbug/test jobs, so a push-to-main run (which follows
      # a PR's ci.yml run against the same commit) gets a cache hit instead of rebuilding
      # lbug's C++ core from source.
      - name: Restore lbug build artifacts from cache
        uses: actions/cache/restore@v4
        with:
          key: lbug-cache-${{ runner.os }}-${{ steps.rustc-ver.outputs.version }}-${{ steps.lbug-hash.outputs.hash }}-${{ env.LBUG_CACHE_BUST }}
          path: |
            target/release/build/lbug-*
            target/release/.fingerprint/lbug-*
            target/release/deps/liblbug-*

      - name: cargo build --release
        run: cargo build --release

      - name: cargo test --release --test real_corpus_e2e -- --ignored
        run: cargo test -p lcg-core --release --test real_corpus_e2e -- --ignored

  mcp-real-corpus-e2e:
    name: mcp_real_corpus_e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: changes
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code_changed == 'true')"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Get rustc version for cache key
        id: rustc-ver
        run: echo "version=$(rustc --version | sha256sum | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Get lbug version hash for cache key
        id: lbug-hash
        run: echo "hash=$(grep -A12 '^name = "lbug"$' Cargo.lock | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Same cache key as ci.yml's build-lbug/test jobs, so a push-to-main run (which follows
      # a PR's ci.yml run against the same commit) gets a cache hit instead of rebuilding
      # lbug's C++ core from source.
      - name: Restore lbug build artifacts from cache
        uses: actions/cache/restore@v4
        with:
          key: lbug-cache-${{ runner.os }}-${{ steps.rustc-ver.outputs.version }}-${{ steps.lbug-hash.outputs.hash }}-${{ env.LBUG_CACHE_BUST }}
          path: |
            target/release/build/lbug-*
            target/release/.fingerprint/lbug-*
            target/release/deps/liblbug-*

      - name: cargo build --release
        run: cargo build --release

      # MCP read-path e2e suite (#234): seeds a workspace from the same golden real-corpus WAL
      # fixture consumed by real_corpus_e2e above, then spawns the real compiled binary over
      # MCP-over-stdio against it — one rebuild (FR-013), same #[ignore]-and-gate-out-of-the-PR-
      # path posture as real_corpus_e2e (FR-015).
      - name: cargo test --release --test mcp_real_corpus_e2e -- --ignored
        run: cargo test -p lcg-service --release --test mcp_real_corpus_e2e -- --ignored

  mcp-write-mutation-e2e:
    name: mcp_real_corpus_mutation_e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: changes
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code_changed == 'true')"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Get rustc version for cache key
        id: rustc-ver
        run: echo "version=$(rustc --version | sha256sum | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Get lbug version hash for cache key
        id: lbug-hash
        run: echo "hash=$(grep -A12 '^name = "lbug"$' Cargo.lock | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Same cache key as ci.yml's build-lbug/test jobs, so a push-to-main run (which follows
      # a PR's ci.yml run against the same commit) gets a cache hit instead of rebuilding
      # lbug's C++ core from source.
      - name: Restore lbug build artifacts from cache
        uses: actions/cache/restore@v4
        with:
          key: lbug-cache-${{ runner.os }}-${{ steps.rustc-ver.outputs.version }}-${{ steps.lbug-hash.outputs.hash }}-${{ env.LBUG_CACHE_BUST }}
          path: |
            target/release/build/lbug-*
            target/release/.fingerprint/lbug-*
            target/release/deps/liblbug-*

      - name: cargo build --release
        run: cargo build --release

      # MCP write/mutation-path e2e suite (#235): the sibling of mcp_real_corpus_e2e above,
      # covering the mutation surface (deletes, merges/corrections, entity/relation retyping,
      # ingest into the pre-populated graph, knowledge_clear_all) instead of the read surface.
      # Forks the seeded workspace once per user-story block (FR-002) rather than reseeding, so
      # this job's cost is one seed + several cheap filesystem copies, not N reseeds. Same
      # #[ignore]-and-gate-out-of-the-PR-path posture as its siblings (FR-018).
      - name: cargo test --release --test mcp_real_corpus_mutation_e2e -- --ignored
        run: cargo test -p lcg-service --release --test mcp_real_corpus_mutation_e2e -- --ignored

  mcp-admin-data-e2e:
    name: mcp_real_corpus_admin_data_e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: changes
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code_changed == 'true')"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Get rustc version for cache key
        id: rustc-ver
        run: echo "version=$(rustc --version | sha256sum | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Get lbug version hash for cache key
        id: lbug-hash
        run: echo "hash=$(grep -A12 '^name = "lbug"$' Cargo.lock | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Same cache key as ci.yml's build-lbug/test jobs, so a push-to-main run (which follows
      # a PR's ci.yml run against the same commit) gets a cache hit instead of rebuilding
      # lbug's C++ core from source.
      - name: Restore lbug build artifacts from cache
        uses: actions/cache/restore@v4
        with:
          key: lbug-cache-${{ runner.os }}-${{ steps.rustc-ver.outputs.version }}-${{ steps.lbug-hash.outputs.hash }}-${{ env.LBUG_CACHE_BUST }}
          path: |
            target/release/build/lbug-*
            target/release/.fingerprint/lbug-*
            target/release/deps/liblbug-*

      - name: cargo build --release
        run: cargo build --release

      # MCP admin/lifecycle e2e suite, data-plane half (#236): dump→rebuild round-trips
      # (including group_id scoping), full rebuild with progress notifications, checkpoint
      # coherence, and index rebuild on an index-less graph. Sibling of mcp_real_corpus_e2e
      # (#234) and mcp_real_corpus_mutation_e2e (#235), completing the MCP e2e trilogy over the
      # same golden real-corpus fixture. Same #[ignore]-and-gate-out-of-the-PR-path posture
      # (FR-016).
      - name: cargo test --release --test mcp_real_corpus_admin_data_e2e -- --ignored
        run: cargo test -p lcg-service --release --test mcp_real_corpus_admin_data_e2e -- --ignored

  mcp-admin-lifecycle-e2e:
    name: mcp_real_corpus_admin_lifecycle_e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: changes
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code_changed == 'true')"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Get rustc version for cache key
        id: rustc-ver
        run: echo "version=$(rustc --version | sha256sum | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Get lbug version hash for cache key
        id: lbug-hash
        run: echo "hash=$(grep -A12 '^name = "lbug"$' Cargo.lock | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Same cache key as ci.yml's build-lbug/test jobs, so a push-to-main run (which follows
      # a PR's ci.yml run against the same commit) gets a cache hit instead of rebuilding
      # lbug's C++ core from source.
      - name: Restore lbug build artifacts from cache
        uses: actions/cache/restore@v4
        with:
          key: lbug-cache-${{ runner.os }}-${{ steps.rustc-ver.outputs.version }}-${{ steps.lbug-hash.outputs.hash }}-${{ env.LBUG_CACHE_BUST }}
          path: |
            target/release/build/lbug-*
            target/release/.fingerprint/lbug-*
            target/release/deps/liblbug-*

      - name: cargo build --release
        run: cargo build --release

      # MCP admin/lifecycle e2e suite, process-lifecycle half (#236): degraded-mode startup and
      # recovery (ADR-0009, the direct regression guard for #207), knowledge_close checkpoint
      # semantics (ADR-0017) and attached-mode --allow-remote-close gating, and admin-scope
      # tool-visibility gating. Same #[ignore]-and-gate-out-of-the-PR-path posture (FR-016).
      - name: cargo test --release --test mcp_real_corpus_admin_lifecycle_e2e -- --ignored
        run: cargo test -p lcg-service --release --test mcp_real_corpus_admin_lifecycle_e2e -- --ignored
