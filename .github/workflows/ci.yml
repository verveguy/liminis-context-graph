name: CI

on:
  push:
    # `maint/**` so a maintenance branch gets the same post-merge signal `main` has.
    # Fabrik's `base:<branch>` puts release-line fixes on maint/* and its merge train is
    # main-only (it pins `DefaultBaseBranch()`), so those merges are hand-landed with no
    # post-merge run unless this trigger covers them. Note GitHub runs the workflow from
    # the *pushed branch's own tree*, so this line must exist on each maint/* branch too
    # — adding it only to main does not make it fire there.
    branches: [main, 'maint/**']
  pull_request:
  workflow_dispatch:
    inputs:
      e2e_only:
        description: >
          Skip the test job (release build verification, clippy, fmt, R-003 bench) and
          run only build-release plus the five real-corpus e2e jobs. Mirrors the old
          standalone `real-corpus-e2e.yml` workflow_dispatch path (see #341) now that
          its jobs live in this file.
        type: boolean
        default: false

# Run CI once per change, not twice. Previously `on: { push, pull_request }` with no
# concurrency control meant every push to a PR branch triggered two concurrent CI runs
# (one `push`, one `pull_request`) on the same commit. They raced on the shared lbug C++
# build cache (same key), and one would intermittently link against a half-written / doubled
# archive set — surfacing as `duplicate symbol: yyjson_*` / `antlr4::*` link failures that
# falsely failed the build and paused Fabrik. Scoping `push` to `main` means a PR branch runs
# CI exactly once (via `pull_request`); `main` still runs on merge. The concurrency group
# additionally cancels superseded in-flight runs when new commits land on the same ref.
#
# #341: this same race resurfaced once `real-corpus-e2e.yml` started running five more
# release-build jobs in parallel on every PR (#328) — five more concurrent readers of the
# same lbug cache key, one landing mid-write (#336). `build-release` below is now the
# *only* job in the entire run that performs a full `cargo build --release`, and it
# remains the sole writer of the lbug cache (as `build-lbug` already was before this
# change — see ADR-0341 for why this reduces the pool of concurrent readers racing a
# same-run write without eliminating the underlying cross-run key collision). Every other
# job (including what used to be `real-corpus-e2e.yml`'s five jobs, merged into this file
# below) only restores — either a same-run artifact of the full release tree (`test`) or
# a same-run artifact of six specific binaries (the five e2e jobs) — and neither of those
# artifacts touches the lbug cache at all. See docs/adr/0341-build-release-artifacts-once.md.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# GitHub's implicit default shell (no `shell:`/`defaults.run.shell` anywhere) is
# `bash -e {0}` — no `pipefail`. That means `cmd 2>&1 | tee log` steps report the exit
# status of `tee`, not `cmd`, so a failing `cargo test`/e2e binary piped through `tee`
# for dual logging can never fail its step. Explicitly setting `shell: bash` switches to
# GitHub's own `bash --noprofile --norc -eo pipefail {0}`, which supplies `pipefail` for
# free — fixing every `| tee` step below (and any added later) without reformatting any
# of them. See #430 and docs/adr/0430-ci-tee-pipefail.md.
defaults:
  run:
    shell: bash

env:
  # Bump this date to manually bust the lbug C++ build cache (e.g., if a cache entry is corrupted).
  # Incrementing this invalidates ALL existing lbug cache entries across all branches.
  LBUG_CACHE_BUST: "2026-07-13"

jobs:
  # Classifies the PR diff so docs-only PRs can skip the expensive Rust build/test/e2e
  # jobs while still satisfying the required `test (ubuntu-latest)` status check. This
  # job is gated by `if:` on the downstream jobs, NOT by `paths`/`paths-ignore` on the
  # `on:` trigger above — filtering the workflow itself would mean the required check
  # never posts on a docs-only PR, leaving it permanently blocked by branch protection.
  # A job skipped via `if:` reports a "skipped" (passing) conclusion instead.
  # See docs/adr/0322-ci-docs-only-fast-path.md and issue #322 for the full rationale,
  # including the classification table and the fail-safe-defaults-to-full-suite design.
  # The classification logic itself lives in ./.github/actions/classify-changes. Per
  # #341, this is now the *only* classify job in the repo — it used to be duplicated
  # between this file and the now-deleted real-corpus-e2e.yml, one call each. The
  # extra-deny-pattern below (previously real-corpus-e2e.yml-only) is now applied
  # unconditionally: a change to the golden real-corpus WAL fixture is code-relevant
  # for the e2e jobs even though it isn't for `test`, and unifying into one classifier
  # output that both consume is simpler and safer than threading two outputs through
  # six downstream jobs for that narrow efficiency gain (see ADR-0341, Key Decisions).
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Runs here rather than in `test`, because `test` is gated on the very
      # output this validates — a pattern wrong in the skip direction would take
      # the test suite down with it and go unreported. This job is unconditional
      # and the check costs a second.
      - name: Check the classification patterns
        run: .github/actions/classify-changes/test-patterns.sh

      - name: Classify diff (docs-only vs code-touching)
        id: classify
        uses: ./.github/actions/classify-changes
        with:
          extra-deny-pattern: "^crates/core/tests/fixtures/real_corpus_wal/"

  # #341: the single build job for the whole workspace. Produces everything every other
  # job needs: the lbug cache (unchanged), a same-run artifact of the full `target/release`
  # tree for `test`, and a small artifact of exactly the six binaries the five e2e jobs
  # need. Nothing downstream of this job invokes `cargo build`/`cargo test --no-run` again.
  build-release:
    name: build release artifacts
    runs-on: ubuntu-latest
    needs: changes
    # `!cancelled()` overrides the default "skip if a dependency didn't succeed" behavior
    # so this still runs when `changes` itself fails outright (e.g. a checkout infra
    # failure) rather than just left its output unset. Without this, `needs.changes
    # .outputs.code_changed == 'true'` would evaluate false on an unset output — skipping
    # the Rust suite via a failed classifier job instead of running it, which would
    # silently satisfy the required `test (ubuntu-latest)` check on a PR that was never
    # actually classified. `needs.changes.result != 'success'` is the fail-safe: any
    # non-success classifier outcome is treated as code-changed, same direction as the
    # in-script fail-safe defaults in the `changes` job itself.
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code_changed == 'true')"
    outputs:
      cache-hit: ${{ steps.lbug-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Cargo's freshness check for path-dependency crates (lcg-core, lcg-service,
      # lcg-eval — everything in this workspace) is mtime-based: it treats a unit as
      # stale if any of its source files has a different mtime than what was recorded
      # when its fingerprint was written. `actions/checkout` does not preserve git
      # commit timestamps — every checkout stamps files with that job's own wall-clock
      # checkout time. Since `test` (below) checks out independently, *after*
      # build-release finishes (`needs:`), its sources would always appear newer than
      # the cached target/release fingerprints it restores, making cargo recompile the
      # entire workspace on every run and tripping the FR-006 "no Compiling" guard.
      # Stamping every tracked file to the commit's own timestamp makes that value
      # identical and deterministic across both jobs' independent checkouts, so the
      # mtime comparison lines up and the restored build is recognized as fresh. This
      # step is a no-op for content — it only touches mtimes, never file contents.
      - name: Normalize source mtimes to commit time (for cross-job cargo cache reuse)
        run: git ls-files -z | xargs -0 touch -d "@$(git log -1 --format=%ct)"

      - uses: dtolnay/rust-toolchain@stable

      - name: Get rustc version for cache key
        id: rustc-ver
        run: echo "version=$(rustc --version | sha256sum | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Get lbug version hash for cache key
        id: lbug-hash
        # Hash the entire lbug stanza from Cargo.lock (12 lines after the name line).
        # This changes on version bump, checksum change, or dependency list change.
        # Unrelated Cargo.lock changes (serde, tokio, etc.) do NOT affect this hash.
        run: echo "hash=$(grep -A12 '^name = "lbug"$' Cargo.lock | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # NOTE: The lbug build script's `output` file embeds absolute paths rooted at
      # /home/runner/work/liminis-context-graph/liminis-context-graph/ — stable on GHA ubuntu-latest
      # but not portable to self-hosted runners with non-standard workspace paths.
      # Note: the lbug prebuilt is a fat bundle; LBUG_BUILD_FROM_SOURCE is no longer
      # needed (and its source-build path is broken). Since 0.18.0 the bundle is no
      # longer *fully* self-contained — OpenSSL links externally, which the staging
      # step below handles. This is a plain (restore-and-auto-save) cache: this job is
      # the ONLY job in the whole run that ever writes this key (#341/FR-003) — every
      # other job that used to restore-only against it now gets its binaries from this
      # job's outputs instead of touching the lbug cache at all.
      - name: Restore/cache lbug build artifacts
        id: lbug-cache
        uses: actions/cache@v6
        with:
          key: lbug-cache-${{ runner.os }}-${{ steps.rustc-ver.outputs.version }}-${{ steps.lbug-hash.outputs.hash }}-${{ env.LBUG_CACHE_BUST }}
          path: |
            target/release/build/lbug-*
            target/release/.fingerprint/lbug-*
            target/release/deps/liblbug-*

      # Force the OpenSSL link static so the binary stays self-contained. lbug 0.18.0
      # moved OpenSSL out of the prebuilt bundle (LadybugDB/ladybug#590) and its
      # build.rs emits -lssl/-lcrypto unconditionally, taking its search path from
      # `pkg-config --variable=libdir openssl` alone. The script points that at a
      # directory holding only libssl.a/libcrypto.a and exports PKG_CONFIG_PATH via
      # $GITHUB_ENV, so the steps below inherit it. Mirrors what the release build
      # does via .github/build-setup.yml. See ADR-0398.
      - name: Stage static OpenSSL for a self-contained link
        run: bash scripts/stage-openssl-static.sh

      # The one and only `cargo build --release` in the whole CI run (#341/FR-001).
      # Builds the `liminis-context-graph` service binary the five e2e jobs need.
      - name: cargo build --release
        run: cargo build --release

      # The permanent pre-tag regression guard. `release.yml`'s build-local-artifacts
      # is gated off on PRs and every ci.yml job runs on ubuntu-latest, so the release
      # binary is otherwise linked for the first time by the release itself — which is
      # exactly how the v0.9.0 `ld: symbol(s) not found` failure reached a tag. This
      # step at least holds the line on Linux: delete the staging step above and this
      # goes red, instead of the dynamic dependency surfacing on a user's machine.
      #
      # Both dist-published binaries, not just the service one: `cargo build --release`
      # above builds every workspace member, and lcg-eval ships its own tarballs and
      # installer on all three targets while reaching lbug through lcg-core, so it
      # links OpenSSL on identical terms. See ADR-0398 and release.yml's equivalent.
      - name: Assert the release binaries have no dynamic OpenSSL dependency
        run: |
          bash scripts/assert-static-openssl.sh \
            target/release/liminis-context-graph \
            target/release/lcg-eval

      # Compiles (links, but does not run) every integration test target, including the
      # five real-corpus e2e test binaries — without this flag the same command would
      # both compile AND run every non-`#[ignore]`d test, which `test` (below) already
      # does against this job's restored output. `--message-format=json` lets the next
      # step locate each target's compiled executable path (cargo hashes the filename,
      # e.g. `real_corpus_e2e-<hash>`, so the path isn't guessable ahead of time).
      - name: cargo test --release --no-run (compile e2e + all other test binaries)
        run: cargo test --release --no-run --message-format=json > /tmp/cargo-test-no-run.json

      # Stages exactly the six binaries the five e2e jobs need (FR-002/FR-004) under
      # fixed names, so the artifact transferred below is tens/hundreds of MB, not the
      # ~2.7GB full `target/release` tree. Fails loudly (not silently short) if any of
      # the six expected test targets didn't produce an executable in the json stream —
      # e.g. because a rename in Cargo.toml or the test file itself broke discovery.
      - name: Stage e2e artifacts (6 test binaries + service binary)
        run: |
          set -euo pipefail
          mkdir -p target/release/e2e-artifacts

          for name in \
            real_corpus_e2e \
            mcp_real_corpus_e2e \
            mcp_real_corpus_mutation_e2e \
            mcp_real_corpus_admin_data_e2e \
            mcp_real_corpus_admin_lifecycle_e2e \
            wal_root_migration \
          ; do
            exe=$(jq -r --arg name "$name" \
              'select(.reason=="compiler-artifact" and .executable != null and (.target.kind[]? == "test") and .target.name == $name) | .executable' \
              /tmp/cargo-test-no-run.json | tail -n1)
            if [ -z "$exe" ] || [ "$exe" = "null" ]; then
              echo "ERROR: could not locate a compiled test binary for target '$name' in cargo's --message-format=json output"
              exit 1
            fi
            cp "$exe" "target/release/e2e-artifacts/$name"
          done

          # Left at its original build path (target/release/liminis-context-graph), NOT
          # copied into e2e-artifacts/: the six test binaries embed
          # env!("CARGO_BIN_EXE_liminis-context-graph") as a compile-time absolute path
          # constant pointing at that exact location, so the consuming job must restore
          # the service binary there, not to an arbitrary renamed path.
          chmod +x target/release/e2e-artifacts/* target/release/liminis-context-graph
          ls -la target/release/e2e-artifacts/

      # Short retention: this artifact is consumed only by sibling jobs in this same
      # run, never across runs. `if-no-files-found: error` is a second, independent
      # guard against the staging step above silently producing fewer than expected.
      - name: Upload e2e artifacts (5 test binaries + service binary)
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            target/release/e2e-artifacts/
            target/release/liminis-context-graph
          retention-days: 1
          if-no-files-found: error

      # `test` (below) needs the *entire* built tree (clippy and the R-003 bench operate
      # over more than the six e2e binaries; `cargo fmt --check` does not need it, but
      # runs in the same job), so it gets a full-tree hand-off via a same-run artifact
      # rather than the small artifact above (FR-004 is scoped to what the e2e jobs need,
      # not to this hand-off — see ADR-0341, Key Decisions). `actions/cache` was
      # considered and rejected for this specific hand-off: this ~2.7GB payload is
      # genuinely single-use (written once, read once by `test`, dead afterward), but a
      # cache entry would still count against this repo's shared 10GB total cache quota
      # alongside the long-lived `lbug-cache-*` entry — repeated multi-GB single-use
      # entries at PR volume risk evicting `lbug-cache-*` ahead of schedule, or evicting
      # this very entry before `test` restores it. `upload-artifact`/`download-artifact`
      # don't share that quota, so this hand-off can't contend with lbug's cache
      # regardless of concurrent CI volume, and (being scoped to this run) needs no
      # explicit cleanup step the way the cache alternative would have.
      - name: Upload full release build for the test job (same-run artifact)
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: target/release/
          retention-days: 1
          if-no-files-found: error

  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [changes, build-release]
    # The `needs.build-release.result == 'success'` clause restates the implicit default
    # ("only run if build-release succeeded") that a custom `if:` would otherwise drop —
    # without it, `test` could attempt to run after a real `build-release` failure.
    # `!cancelled()` + `needs.changes.result != 'success'` mirror build-release's
    # fail-safe above, for the same reason: a failed `changes` job must not silently
    # skip `test`. The final clause implements the `e2e_only` workflow_dispatch input
    # (#341): a manual "e2e only" run still needs `build-release` (the e2e jobs depend
    # on it) but skips this job's own release-verification/clippy/fmt/bench tail.
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code_changed == 'true') && needs.build-release.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.e2e_only)"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Must match build-release's own normalization step exactly (same commit, same
      # deterministic timestamp) — see that step's comment for why this is required
      # for the restored target/release below to be recognized as fresh rather than
      # triggering a full recompile.
      - name: Normalize source mtimes to commit time (for cross-job cargo cache reuse)
        run: git ls-files -z | xargs -0 touch -d "@$(git log -1 --format=%ct)"

      # Restores the entire `target/release` tree `build-release` just produced and
      # uploaded as a same-run artifact. `download-artifact` already fails the step if
      # the named artifact isn't present in this run — a missing artifact is a loud job
      # failure, not a silent fall-back to rebuilding — per the spec's Edge Cases, a job
      # that can't obtain its binaries must fail loudly, not quietly recompile and
      # reintroduce the redundant-build problem this exists to fix.
      - name: Download full release build from build-release (same-run artifact)
        uses: actions/download-artifact@v8
        with:
          name: release-build
          path: target/release

      # `actions/upload-artifact@v7` zips the tree and does not preserve POSIX
      # executable bits (files come back 644) — without this, every compiled test
      # binary under target/release/deps/, every build-script-build executable under
      # target/release/build/*, and the liminis-context-graph service binary itself
      # would fail with "Permission denied" the moment cargo or a test harness tries
      # to run them. The five e2e jobs below chmod their two known binaries by name;
      # this job restores the whole tree, so it recurses over every regular file.
      - name: Restore executable bits (actions/upload-artifact does not preserve them)
        run: find target/release -type f -exec chmod +x {} +

      # With the full tree restored, this should be a pure cache hit: no compilation,
      # only running the ~50 already-linked integration-test binaries (crates/core: 37,
      # crates/service: 11, crates/eval: 2). The output is captured so the next step can
      # assert that was actually true.
      - name: cargo test --release (restored build; captured for recompile-regression check)
        run: cargo test --release 2>&1 | tee /tmp/build.log

      # Issue #500 FR-006/SC-004: regression guard for leaked, orphaned liminis-context-graph
      # processes. crates/service/tests/ spawns the built binary as a subprocess in many
      # integration tests (socket mode, MCP-stdio standalone/attached mode, migration,
      # eager-index-build); before #500's fix, a test panic/failure between spawn and its own
      # cleanup — or a signal swallowed during the binary's own startup race window — could leave
      # the process running past the end of the suite. `pgrep -af` matches the trailing space to
      # avoid matching unrelated binaries (e.g. `liminis-context-graph-something`) and prints the
      # PID + full command line of any survivor for debugging.
      - name: Check for leaked liminis-context-graph processes (issue #500 regression guard)
        run: |
          if pgrep -af "liminis-context-graph "; then
            echo "ERROR: liminis-context-graph process(es) above are still running after the test suite finished — see issue #500"
            exit 1
          fi
          echo "OK: no leaked liminis-context-graph processes found"

      # #341/FR-006: generalized regression guard for Story 4. Previously this only
      # checked for "Compiling lbug " specifically (the original FR-008, from when this
      # job did its own `cargo build --release`). Now that `test` never builds anything
      # itself — it only restores build-release's output — ANY "Compiling " line here
      # means the restore silently failed to avoid recompilation for some crate, not
      # just lbug, so the check is no longer lbug-specific.
      - name: Assert no workspace code recompiled after restoring build-release's output (FR-006)
        run: |
          if grep -q "Compiling " /tmp/build.log; then
            echo "ERROR: workspace code recompiled despite restoring build-release's target/release artifact — the hand-off is broken"
            grep "Compiling " /tmp/build.log
            exit 1
          fi
          echo "OK: full cache hit confirmed, no recompilation after restoring build-release's output"

      # The benchmark scripts' guards decide whether to spend money on a multi-hour run, and
      # they had no automated coverage — #278 took seven review rounds, with roughly half the
      # findings introduced by the previous round's fix. These run in seconds and need no
      # network, API key, model server, or built binary, so they belong on every PR.
      # They also cover portability: `md5 -q` shipped once and would have failed only here,
      # on Linux, in the direction that blocks a valid run.
      - name: eval script guards
        run: crates/eval/scripts/test-scripts.sh

      # R-003 correctness gate: 95% decision-overlap between brute-force and hybrid dedup.
      # Runs here (not bench-dedup) so it shares the release build artifacts already restored
      # into ./target/. `dedup_overlap_check` is its own [[bench]] target (not a group sharing a
      # criterion_main! with other benches, see ADR-0316) so this invocation pays only its
      # own ~1k-entity setup, not the other bench groups' — the previous shared-binary
      # layout made this step ~10-11 minutes; isolated, it's ~1-2.
      - name: dedup decision-overlap check (R-003)
        run: cargo bench --bench dedup_overlap_check

      # Before ADR-0316's split, this same `dedup_overlap_check` invocation compiled all
      # of former search.rs's code in one binary, so a compile break anywhere in it was
      # caught here even though only one function ran. Now that the four sibling groups
      # (dedup_search, dedup_50k, name_lookup, hybrid_search) are separate [[bench]]
      # targets, nothing else in the PR-blocking job compiles them — `cargo build`/`test`
      # --release don't touch bench targets, and bench.yml (the only thing that would)
      # is workflow_dispatch-only. `check` (not `bench --no-run`) keeps this cheap: it
      # type-checks without codegen, ~10-30s reusing this job's already-restored release deps.
      - name: compile-check remaining bench targets
        run: cargo check --release --benches -p lcg-core

      - name: check no ML runtime deps
        run: |
          # Match crate names only — "tch" must not also match "scratch", etc.
          # cargo tree prints lines like "├── tch v0.18.0"; an awk filter on the
          # crate-name token avoids the substring false positives the prior grep had.
          banned=$(cargo tree 2>/dev/null \
            | awk '{ for (i=1;i<=NF;i++) if ($i ~ /^v[0-9]/) print $(i-1) }' \
            | grep -Ex '(tch|candle|onnxruntime|tract)' || true)
          if [ -n "$banned" ]; then
            echo "ERROR: ML runtime dependency detected — violates Principle V"
            echo "$banned"
            exit 1
          fi
          echo "OK: no ML runtime deps found"

      - name: cargo clippy
        run: cargo clippy --release -- -D warnings

      - name: cargo fmt
        run: cargo fmt --check

  # #341: the five real-corpus e2e jobs, merged in from the now-deleted
  # real-corpus-e2e.yml so a single `needs: build-release` can gate them at job
  # granularity — GitHub Actions' `needs:`/artifact sharing only works between jobs in
  # the same workflow file, not across two independently-triggered top-level workflows
  # (see ADR-0341 for why a `workflow_call` orchestrator can't do this at sub-job
  # granularity). Each job here downloads exactly the two binaries it needs (its own
  # test binary + the service binary) from build-release's artifact and invokes the
  # test binary directly. Unlike build-release/test, these jobs don't add an explicit
  # `dtolnay/rust-toolchain@stable` step — but that alone is not a structural guarantee:
  # `ubuntu-latest` images ship a preinstalled Rust toolchain regardless, so `cargo`/
  # `rustc` are on PATH here whether or not this workflow asks for them. FR-006/Story 4's
  # actual guard for these five jobs is the same mechanism `test` uses: each job's test
  # binary invocation is captured to a log and grepped for a "Compiling " line, failing
  # loudly if a future change adds a recompile step after the artifact download.
  #
  # The real_corpus_e2e tests (crates/core/tests/real_corpus_e2e.rs, #217) and their MCP
  # siblings are #[ignore]d out of the default `cargo test --release` run: a full WAL
  # replay + HNSW/FTS index build over the golden fixture's 1,506 entities takes roughly
  # a minute each. Per #328: these run in parallel with `test` (not appended after it,
  # and not gating merge) — the suite's own wall clock finishes well before the required
  # `test (ubuntu-latest)` check, so this is expected to add zero latency to a PR's
  # time-to-mergeable. See docs/adr/0328-real-corpus-e2e-on-pr-path.md for the original
  # rationale and docs/adr/0341-build-release-artifacts-once.md for why these jobs now live in this file.
  real-corpus-e2e:
    name: real_corpus_e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [changes, build-release]
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code_changed == 'true') && needs.build-release.result == 'success'"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Restores to target/release/ so the service binary lands at exactly the path
      # (target/release/liminis-context-graph) baked into the test binary's
      # CARGO_BIN_EXE_liminis-context-graph compile-time constant, and the checkout
      # above puts CARGO_MANIFEST_DIR-relative fixtures at the same paths they had
      # during the build — both jobs run on ubuntu-latest with the same standard
      # /home/runner/work/... checkout path.
      - name: Download e2e artifacts (test binary + service binary)
        uses: actions/download-artifact@v8
        with:
          name: e2e-artifacts
          path: target/release

      - name: Mark binaries executable
        run: chmod +x target/release/liminis-context-graph target/release/e2e-artifacts/*

      # Direct invocation of the compiled test binary, equivalent to what
      # `cargo test -p lcg-core --release --test real_corpus_e2e -- --ignored` did
      # before #341: everything after `--` there was already passed straight through
      # to this same binary. RUST_TEST_THREADS=4 replicates .cargo/config.toml's
      # workspace-wide `[env]` setting, which only applies when cargo itself spawns the
      # process — invoking the binary directly bypasses that, so it's set explicitly here.
      - name: real_corpus_e2e -- --ignored
        env:
          RUST_TEST_THREADS: "4"
        run: ./target/release/e2e-artifacts/real_corpus_e2e --ignored 2>&1 | tee /tmp/e2e-run.log

      # #341/FR-006: same guard `test` uses, applied here because `ubuntu-latest` ships a
      # preinstalled Rust toolchain — omitting an explicit toolchain-install step does not
      # by itself stop a future change from invoking `cargo` after the artifact download.
      - name: Assert no workspace code compiled during this job (FR-006)
        run: |
          if grep -q "Compiling " /tmp/e2e-run.log; then
            echo "ERROR: a 'Compiling' line appeared in this job's output — something invoked cargo build/test after downloading the shared artifact, defeating FR-002/FR-006"
            grep "Compiling " /tmp/e2e-run.log
            exit 1
          fi
          echo "OK: no recompilation detected in this job's output"

