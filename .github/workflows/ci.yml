name: CI

on:
  push:
    branches: [main]
  pull_request:

# Run CI once per change, not twice. Previously `on: { push, pull_request }` with no
# concurrency control meant every push to a PR branch triggered two concurrent CI runs
# (one `push`, one `pull_request`) on the same commit. They raced on the shared lbug C++
# build cache (same key), and one would intermittently link against a half-written / doubled
# archive set — surfacing as `duplicate symbol: yyjson_*` / `antlr4::*` link failures that
# falsely failed the build and paused Fabrik. Scoping `push` to `main` means a PR branch runs
# CI exactly once (via `pull_request`); `main` still runs on merge. The concurrency group
# additionally cancels superseded in-flight runs when new commits land on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Bump this date to manually bust the lbug C++ build cache (e.g., if a cache entry is corrupted).
  # Incrementing this invalidates ALL existing lbug cache entries across all branches.
  LBUG_CACHE_BUST: "2026-07-13"

jobs:
  # Classifies the PR diff so docs-only PRs can skip the expensive Rust build/test job
  # while still satisfying the required `test (ubuntu-latest)` status check. This job
  # is gated by `if:` on the two downstream jobs, NOT by `paths`/`paths-ignore` on the
  # `on:` trigger above — filtering the workflow itself would mean the required check
  # never posts on a docs-only PR, leaving it permanently blocked by branch protection.
  # A job skipped via `if:` reports a "skipped" (passing) conclusion instead.
  # See docs/adr/0322-ci-docs-only-fast-path.md and issue #322 for the full rationale,
  # including the classification table and the fail-safe-defaults-to-full-suite design.
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Classify diff (docs-only vs code-touching)
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fail-safe by construction: every early-return below defaults to
          # code_changed=true. The only way to get code_changed=false is the single
          # success path at the bottom where the diff was actually computed and
          # matched against the deny-list. An infra hiccup must never silently skip
          # the suite.
          set -uo pipefail

          emit() {
            echo "code_changed=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            # push is scoped to branches: [main] above (post-merge only) — nobody is
            # blocked waiting on it, so it always runs the full suite unconditionally.
            emit true "non-pull_request event ($EVENT_NAME): running full suite unconditionally"
            exit 0
          fi

          # Relies on GitHub.com's uploadpack.allowReachableSHA1InWant support for
          # fetching arbitrary commit SHAs by ID; a platform behavior, not repo config.
          if ! git fetch --depth=1 origin "$BASE_SHA" "$HEAD_SHA"; then
            emit true "WARNING: git fetch of base/head SHA failed, defaulting to full suite (fail-safe)"
            exit 0
          fi

          CHANGED_FILES=$(git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA")
          if [ $? -ne 0 ]; then
            emit true "WARNING: git diff failed, defaulting to full suite (fail-safe)"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Deny-list: any match anywhere in the diff forces the full suite. Unmatched
          # paths default to docs — safe because this is a deny-list, not an allow-list,
          # so a newly-added code-relevant path just needs a pattern added later; it
          # doesn't silently skip today by being unrecognized in the dangerous direction.
          # --no-renames makes a rename (e.g. `.rs` moved into `docs/`) show as a delete
          # of the old path plus an add of the new one, so the old path's extension still
          # trips this pattern instead of being hidden behind git's rename heuristics.
          if echo "$CHANGED_FILES" | grep -E '(\.rs$|Cargo\.(toml|lock)$|^\.cargo/|^\.github/workflows/|^crates/eval/scripts/)'; then
            emit true "code-relevant path(s) matched above: running full suite"
          else
            emit false "no code-relevant paths matched: skipping Rust build/test job"
          fi

  build-lbug:
    name: build lbug cache
    runs-on: ubuntu-latest
    needs: changes
    # `!cancelled()` overrides the default "skip if a dependency didn't succeed" behavior
    # so this still runs when `changes` itself fails outright (e.g. a checkout infra
    # failure) rather than just left its output unset. Without this, `needs.changes
    # .outputs.code_changed == 'true'` would evaluate false on an unset output — skipping
    # the Rust suite via a failed classifier job instead of running it, which would
    # silently satisfy the required `test (ubuntu-latest)` check on a PR that was never
    # actually classified. `needs.changes.result != 'success'` is the fail-safe: any
    # non-success classifier outcome is treated as code-changed, same direction as the
    # in-script fail-safe defaults in the `changes` job itself.
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code_changed == 'true')"
    outputs:
      cache-hit: ${{ steps.lbug-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Get rustc version for cache key
        id: rustc-ver
        run: echo "version=$(rustc --version | sha256sum | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Get lbug version hash for cache key
        id: lbug-hash
        # Hash the entire lbug stanza from Cargo.lock (12 lines after the name line).
        # This changes on version bump, checksum change, or dependency list change.
        # Unrelated Cargo.lock changes (serde, tokio, etc.) do NOT affect this hash.
        run: echo "hash=$(grep -A12 '^name = "lbug"$' Cargo.lock | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore/cache lbug build artifacts
        id: lbug-cache
        uses: actions/cache@v4
        with:
          key: lbug-cache-${{ runner.os }}-${{ steps.rustc-ver.outputs.version }}-${{ steps.lbug-hash.outputs.hash }}-${{ env.LBUG_CACHE_BUST }}
          path: |
            target/release/build/lbug-*
            target/release/.fingerprint/lbug-*
            target/release/deps/liblbug-*

      # NOTE: The lbug build script's `output` file embeds absolute paths rooted at
      # /home/runner/work/liminis-context-graph/liminis-context-graph/ — stable on GHA ubuntu-latest
      # but not portable to self-hosted runners with non-standard workspace paths.
      # Note: lbug 0.17.0+ prebuilt is a self-contained fat bundle; LBUG_BUILD_FROM_SOURCE
      # is no longer needed. This step just populates the cache so the test job gets a hit.
      - name: Populate lbug prebuilt cache (skipped on cache hit)
        if: steps.lbug-cache.outputs.cache-hit != 'true'
        run: cargo build --release -p lcg-core

  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [changes, build-lbug]
    # The `needs.build-lbug.result == 'success'` clause restates the implicit default
    # ("only run if build-lbug succeeded") that a custom `if:` would otherwise drop —
    # without it, `test` could attempt to run after a real `build-lbug` failure.
    # `!cancelled()` + `needs.changes.result != 'success'` mirror build-lbug's fail-safe
    # above, for the same reason: a failed `changes` job must not silently skip `test`.
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code_changed == 'true') && needs.build-lbug.result == 'success'"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Get rustc version for cache key
        id: rustc-ver
        run: echo "version=$(rustc --version | sha256sum | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Get lbug version hash for cache key
        id: lbug-hash
        run: echo "hash=$(grep -A12 '^name = "lbug"$' Cargo.lock | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore lbug build artifacts from cache
        id: lbug-cache-restore
        uses: actions/cache/restore@v4
        with:
          key: lbug-cache-${{ runner.os }}-${{ steps.rustc-ver.outputs.version }}-${{ steps.lbug-hash.outputs.hash }}-${{ env.LBUG_CACHE_BUST }}
          path: |
            target/release/build/lbug-*
            target/release/.fingerprint/lbug-*
            target/release/deps/liblbug-*

      # `cargo test` must stay --release: linking the 6 integration-test
      # binaries against lbug + third-party static archives in debug mode
      # OOMs the 7GB Ubuntu runner during `ld` (bus error / signal 7).
      # Release dead-code-eliminates enough to fit.
      - name: cargo build --release (capture output for cache regression check)
        run: cargo build --release 2>&1 | tee /tmp/build.log

      # FR-008: assert that lbug's C++ cmake build did NOT run on a cache-hit.
      # If "Compiling lbug" appears in the build log on a cache-hit, the cache
      # is silently broken and CI would creep back to ~1h wall-clock.
      - name: Assert lbug not recompiled on cache-hit run (FR-008)
        if: steps.lbug-cache-restore.outputs.cache-hit == 'true'
        run: |
          if grep -q "Compiling lbug " /tmp/build.log; then
            echo "ERROR: lbug C++ recompiled despite cache-hit — cache is not working"
            exit 1
          fi
          echo "OK: lbug cache hit confirmed, no recompilation"

      - name: cargo test
        run: cargo test --release

      # The benchmark scripts' guards decide whether to spend money on a multi-hour run, and
      # they had no automated coverage — #278 took seven review rounds, with roughly half the
      # findings introduced by the previous round's fix. These run in seconds and need no
      # network, API key, model server, or built binary, so they belong on every PR.
      # They also cover portability: `md5 -q` shipped once and would have failed only here,
      # on Linux, in the direction that blocks a valid run.
      - name: eval script guards
        run: crates/eval/scripts/test-scripts.sh

      # R-003 correctness gate: 95% decision-overlap between brute-force and hybrid dedup.
      # Runs here (not bench-dedup) so it shares the lbug build artifacts already in ./target/.
      - name: dedup decision-overlap check (R-003)
        run: cargo bench --bench search -- dedup_overlap_check

      - name: check no ML runtime deps
        run: |
          # Match crate names only — "tch" must not also match "scratch", etc.
          # cargo tree prints lines like "├── tch v0.18.0"; an awk filter on the
          # crate-name token avoids the substring false positives the prior grep had.
          banned=$(cargo tree 2>/dev/null \
            | awk '{ for (i=1;i<=NF;i++) if ($i ~ /^v[0-9]/) print $(i-1) }' \
            | grep -Ex '(tch|candle|onnxruntime|tract)' || true)
          if [ -n "$banned" ]; then
            echo "ERROR: ML runtime dependency detected — violates Principle V"
            echo "$banned"
            exit 1
          fi
          echo "OK: no ML runtime deps found"

      - name: cargo clippy
        run: cargo clippy --release -- -D warnings

      - name: cargo fmt
        run: cargo fmt --check
