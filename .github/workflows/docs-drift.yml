name: Docs drift check

on:
  pull_request:

concurrency:
  group: docs-drift-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-llms-full:
    name: Verify llms-full.txt is up to date
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Regenerate llms-full.txt
        run: bash scripts/generate-docs-llms-full.sh

      - name: Fail if llms-full.txt is out of date
        run: |
          if ! git diff --exit-code docs/llms-full.txt; then
            echo ""
            echo "docs/llms-full.txt is out of date."
            echo "Run 'scripts/generate-docs-llms-full.sh' and commit the result alongside"
            echo "your doc changes."
            exit 1
          fi

  check-internal-links:
    name: Build site and check internal links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Version given explicitly. The action otherwise reads `packageManager`
      # from a package.json at the repository root, and this is a Rust workspace
      # — there is no root package.json for it to read, so it fails outright.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: site
        run: pnpm build

      # The specific failure this catches: docs/*.md link to each other as
      # `configuration.md`, which is right on GitHub and rewritten for the site
      # by sync-docs.mjs. A link that slips through unrewritten looks correct in
      # the repository and 404s on the site.
      - name: Check internal links
        working-directory: site
        run: pnpm links

      # A committed SVG that no longer matches the fence it came from is a stale
      # picture on github.com. Stale documentation is worse than none.
      - name: Check the rendered diagrams are current
        working-directory: site
        run: pnpm diagrams:check

      # Continuous regression coverage for the base override that
      # docs-publish-build.sh relies on to build every non-root version (see
      # docs/adr/0477-tag-based-versioned-docs-publishing.md). The links between
      # these pages are rewritten by sync-docs.mjs and are relative, so this is a
      # real assertion that a non-root base still resolves them (FR-005) rather
      # than a one-off manual check.
      - name: Build site (versioned base)
        working-directory: site
        env:
          DOCS_BASE: /liminis-context-graph/v0.0.0-baseurl-check
          DOCS_VERSION: 0.0.0-baseurl-check
        run: pnpm build --outDir dist-versioned

      - name: Check internal links (versioned base)
        working-directory: site
        env:
          DOCS_BASE: /liminis-context-graph/v0.0.0-baseurl-check
        run: node scripts/check-links.mjs dist-versioned
