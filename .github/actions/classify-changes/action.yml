name: Classify changes
description: >
  Classifies a PR diff as docs-only or code-touching, so callers can skip
  expensive jobs on docs-only PRs. Single source of truth, called once from
  ci.yml's `changes` job (see docs/adr/0322-ci-docs-only-fast-path.md,
  docs/adr/0328-real-corpus-e2e-on-pr-path.md, and docs/adr/0341-build-release-artifacts-once.md — the
  real-corpus e2e jobs were originally in their own workflow file with their
  own call to this action; #341 merged them into ci.yml, leaving one caller
  and one classifier output shared by all downstream jobs). Fail-safe by
  construction: every early return below defaults to code_changed=true. The
  only path to code_changed=false is the single success branch at the
  bottom, where the diff was actually computed and matched against the
  deny-list. An infra hiccup must never silently skip a caller's suite.

inputs:
  extra-deny-pattern:
    description: >
      Optional additional regex, OR'd into the base deny-list, for a
      caller-specific code-relevant path the base list doesn't cover (e.g.
      the real-corpus e2e jobs' golden WAL fixture directory). Must not
      contain a `|` char at the start/end (it is embedded directly inside
      the base pattern's outer parens).
    required: false
    default: ""

outputs:
  code_changed:
    description: "'true' if the diff matches the deny-list (or classification could not be computed), 'false' otherwise"
    value: ${{ steps.classify.outputs.code_changed }}

runs:
  using: composite
  steps:
    - name: Classify diff (docs-only vs code-touching)
      id: classify
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EXTRA_DENY_PATTERN: ${{ inputs.extra-deny-pattern }}
      run: |
        set -uo pipefail

        emit() {
          echo "code_changed=$1" >> "$GITHUB_OUTPUT"
          echo "$2"
        }

        if [ "$EVENT_NAME" != "pull_request" ]; then
          # push is scoped to branches: [main] in every caller (post-merge only) —
          # nobody is blocked waiting on it, so it always runs the full suite
          # unconditionally.
          emit true "non-pull_request event ($EVENT_NAME): running full suite unconditionally"
          exit 0
        fi

        # Every caller checks out with persist-credentials: false (see #328's checkout
        # hardening), so this fetch runs with no git credentials configured — it works
        # today only because this repo is public and GitHub serves anonymous git-protocol
        # reads for public repos. If this repo ever goes private, the fetch below 403s and
        # the fail-safe (defaulting to code_changed=true) takes over, so the classifier
        # degrades to "always run" rather than failing silently — but the fast path this
        # workflow exists for would stop working until a `token:` is added back to the
        # calling job's checkout step.
        #
        # Relies on GitHub.com's uploadpack.allowReachableSHA1InWant support for
        # fetching arbitrary commit SHAs by ID; a platform behavior, not repo config.
        # No --depth here: a shallow single-commit fetch has no shared history to
        # compute a merge-base from, and diffing BASE_SHA..HEAD_SHA directly
        # (two-dot) would then pick up unrelated commits landed on the base branch
        # after this PR branched, over-classifying stale/long-lived PRs as
        # code-touching for reasons unrelated to their own diff.
        # For a fork-based PR, HEAD_SHA only exists on the fork; fetching it by raw
        # SHA from `origin` (the base repo) works because GitHub materializes an
        # open PR's head commit under the base repo's hidden refs/pull/<n>/head ref,
        # making it fetchable there too — not verified against a live fork PR in
        # this repo's validation, but the fail-safe below covers the failure mode
        # either way: a fetch failure defaults to running the full suite, never to
        # a silent skip.
        if ! git fetch origin "$BASE_SHA" "$HEAD_SHA"; then
          emit true "WARNING: git fetch of base/head SHA failed, defaulting to full suite (fail-safe)"
          exit 0
        fi

        MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
        if [ $? -ne 0 ]; then
          emit true "WARNING: git merge-base failed, defaulting to full suite (fail-safe)"
          exit 0
        fi

        CHANGED_FILES=$(git diff --no-renames --name-only "$MERGE_BASE" "$HEAD_SHA")
        if [ $? -ne 0 ]; then
          emit true "WARNING: git diff failed, defaulting to full suite (fail-safe)"
          exit 0
        fi

        echo "Changed files:"
        echo "$CHANGED_FILES"

        # Deny-list: any match anywhere in the diff forces the full suite.
        # Unmatched paths default to docs. This is a known, accepted gap, not a
        # safe default: a genuinely new code-relevant path that isn't yet in the
        # pattern below WILL be classified as docs and skip the caller's suite.
        # Keeping this a deny-list rather than an allow-list is still the right
        # tradeoff (see docs/adr/0322-ci-docs-only-fast-path.md, Consequences),
        # but adding a new code-relevant path requires remembering to add a
        # pattern here — it is not automatic.
        # --no-renames makes a rename (e.g. `.rs` moved into `docs/`) show as a
        # delete of the old path plus an add of the new one, so the old path's
        # extension still trips this pattern instead of being hidden behind git's
        # rename heuristics.
        # ^\.github/actions/ is included so this classifier can't classify a change
        # to its own logic as docs-only — without it, a PR touching only this file
        # (which lives outside ^\.github/workflows/) would skip the very suites it
        # exists to gate.
        # ^scripts/ is included because the top-level scripts/ directory holds build and
        # release logic the Rust jobs depend on — stage-openssl-rpath.sh, which forces
        # the @rpath OpenSSL linkage, and assert-openssl-linkage.sh, which is the guard that
        # catches its absence (ADR-0550). Both run inside `build-release`, so without
        # this pattern a PR editing only those scripts would be classified docs-only and
        # skip the very job that exercises them.
        # Patterns live in patterns.sh so the test suite exercises the same strings
        # CI does. A failure to source aborts this step, which fails the `changes`
        # job — and ADR-0322 §3's `needs.changes.result != 'success'` guards then
        # treat that as code-changed, so the fail-safe direction still holds.
        # shellcheck source=patterns.sh
        source "${GITHUB_ACTION_PATH}/patterns.sh"

        PATTERN="${CODE_PATTERN}"
        if [ -n "$EXTRA_DENY_PATTERN" ]; then
          PATTERN="${PATTERN%)}|${EXTRA_DENY_PATTERN})"
        fi

        # `|| true` would be wrong here, and wrong in the dangerous direction: it
        # masks a grep *error* (exit > 1) as well as "no lines selected", leaving
        # CODE_CANDIDATES empty so the deny-list below matches nothing and the PR
        # is classified docs-only. A malformed pattern would silently skip the
        # suite — the precise inversion of ADR-0322 §3. Exit 1 is the ordinary
        # case (every changed file was documentation-only); anything above it is
        # an error and defaults to the full suite.
        DOCS_GREP_STATUS=0
        CODE_CANDIDATES=$(echo "$CHANGED_FILES" | grep -Ev "$DOCS_ONLY_PATTERN") || DOCS_GREP_STATUS=$?
        if [ "$DOCS_GREP_STATUS" -gt 1 ]; then
          emit true "WARNING: grep failed (exit $DOCS_GREP_STATUS) while filtering documentation-only paths, defaulting to full suite (fail-safe)"
          exit 0
        fi

        # `shell: bash` runs with `-eo pipefail`. A bare command substitution whose grep
        # exits 1 (no match) therefore aborts the step *before* the next line executes —
        # `GREP_STATUS=$?` never runs, and the `-eq 1` arm below is unreachable. That is
        # precisely the docs-only case this action exists to detect, so every genuinely
        # docs-only PR failed closed instead of skipping. `|| GREP_STATUS=$?` keeps the
        # assignment from tripping `-e` while still capturing grep's real exit status, so
        # the three-way branch (matched / no match / grep error) behaves as written.
        GREP_STATUS=0
        MATCHES=$(echo "$CODE_CANDIDATES" | grep -E "$PATTERN") || GREP_STATUS=$?
        if [ "$GREP_STATUS" -eq 0 ]; then
          echo "$MATCHES"
          emit true "code-relevant path(s) matched above: running full suite"
        elif [ "$GREP_STATUS" -eq 1 ]; then
          emit false "no code-relevant paths matched: skipping"
        else
          emit true "WARNING: grep failed (exit $GREP_STATUS, likely an invalid extra-deny-pattern), defaulting to full suite (fail-safe)"
        fi
