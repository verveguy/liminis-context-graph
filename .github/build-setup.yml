# Note: LBUG_BUILD_FROM_SOURCE was removed with the lbug 0.17.0 bump and must
# stay unset. The prebuilt is a fat bundle; source builds cause 7399
# duplicate-symbol linker errors. See LadybugDB/ladybug-rust#18.
#
# The bundle is no longer *fully* self-contained: 0.18.0 moved OpenSSL out of
# it (LadybugDB/ladybug#590), so builds must run scripts/stage-openssl-rpath.sh
# so the binary names no machine-specific OpenSSL path. See ADR-0550.
#
# That step deliberately does NOT live in this fragment. cargo-dist inlines
# build-setup.yml *above* its own "Install dependencies" step, which is what
# applies `[workspace.metadata.dist.dependencies.*]` — and openssl@3, whose keg
# the script copies its dylibs from, comes from exactly there. Staged from here,
# the script would run before its own dependency was installed and die with
# "could not locate an openssl@3 keg".
#
# The step therefore lives in .github/workflows/release.yml, between "Install
# dependencies" and "Build artifacts". `allow-dirty = ["ci"]` preserves it there.
# If you ever regenerate release.yml, re-add it in that position by hand — a
# regenerated workflow without it builds and ships a macOS binary that hardcodes
# the build runner's Homebrew path, and only scripts/assert-openssl-linkage.sh
# catches that.

- name: Get rustc version for lbug cache key
  id: rustc-ver
  run: echo "version=$(rustc --version | shasum -a 256 | cut -c1-8)" >> "$GITHUB_OUTPUT"

- name: Get lbug version hash for lbug cache key
  id: lbug-hash
  run: echo "hash=$(grep -A12 '^name = "lbug"$' Cargo.lock | shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"

- name: Restore lbug build artifacts from cache
  uses: actions/cache/restore@v6
  with:
    key: lbug-cache-${{ runner.os }}-${{ steps.rustc-ver.outputs.version }}-${{ steps.lbug-hash.outputs.hash }}-2026-05-29
    path: |
      target/release/build/lbug-*
      target/release/.fingerprint/lbug-*
      target/release/deps/liblbug-*

# Issue #559 / ADR-0559: bundle the lbug vector/fts extension binaries into the release
# archive so a fresh install never has to download them from extension.ladybugdb.com at
# startup. Unlike scripts/stage-openssl-rpath.sh this has no dependency on a package
# cargo-dist's own "Install dependencies" step provides, so it doesn't need to run after that
# step.
#
# THIS COPY IS NOT LIVE. `allow-dirty = ["ci"]` (Cargo.toml) makes `dist generate` refuse to
# run at all ("'ci' is marked as allow-dirty ... refusing to run"), so nothing ever inlines
# this fragment into .github/workflows/release.yml automatically — the identical step is
# hand-added there (in build-local-artifacts, right after "Restore lbug build artifacts from
# cache"), the same way scripts/stage-openssl-rpath.sh's step is hand-added rather than living
# in this file. Edit both places together; this file only documents the intended content, it
# does not produce it.
#
# Stages into .lbdb/ at the workspace root, which Cargo.toml's `[workspace.metadata.dist]
# include` then packages into this job's archive alongside LICENSE/README.md/CHANGELOG.md.
#
# Maps the Rust target triple to lbug's own extension-directory platform string. Must stay in
# lockstep with crates/core/src/lbug_extension_home.rs's platform_string() — a 4th release
# target needs both updated together.
- name: Stage lbug vector/fts extensions for this target
  run: |
    set -euo pipefail
    case "${{ join(matrix.targets, '') }}" in
      aarch64-apple-darwin) platform=osx_arm64 ;;
      x86_64-unknown-linux-gnu) platform=linux_amd64 ;;
      aarch64-unknown-linux-gnu) platform=linux_arm64 ;;
      *)
        echo "no lbug extension platform mapping for target '${{ join(matrix.targets, '') }}' — update .github/build-setup.yml, .github/workflows/release.yml, and crates/core/src/lbug_extension_home.rs together" >&2
        exit 1
        ;;
    esac
    bash scripts/stage-lbug-extensions.sh "$platform" "$(pwd)"
