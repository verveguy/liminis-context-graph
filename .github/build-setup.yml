# Note: LBUG_BUILD_FROM_SOURCE was removed with the lbug 0.17.0 bump and must
# stay unset. The prebuilt is a fat bundle; source builds cause 7399
# duplicate-symbol linker errors. See LadybugDB/ladybug-rust#18.
#
# The bundle is no longer *fully* self-contained: 0.18.0 moved OpenSSL out of
# it (LadybugDB/ladybug#590), so builds must run scripts/stage-openssl-rpath.sh
# so the binary names no machine-specific OpenSSL path. See ADR-0550.
#
# That step deliberately does NOT live in this fragment. cargo-dist inlines
# build-setup.yml *above* its own "Install dependencies" step, which is what
# applies `[workspace.metadata.dist.dependencies.*]` — and openssl@3, whose keg
# the script copies its dylibs from, comes from exactly there. Staged from here,
# the script would run before its own dependency was installed and die with
# "could not locate an openssl@3 keg".
#
# The step therefore lives in .github/workflows/release.yml, between "Install
# dependencies" and "Build artifacts". `allow-dirty = ["ci"]` preserves it there.
# If you ever regenerate release.yml, re-add it in that position by hand — a
# regenerated workflow without it builds and ships a macOS binary that hardcodes
# the build runner's Homebrew path, and only scripts/assert-openssl-linkage.sh
# catches that.

- name: Get rustc version for lbug cache key
  id: rustc-ver
  run: echo "version=$(rustc --version | shasum -a 256 | cut -c1-8)" >> "$GITHUB_OUTPUT"

- name: Get lbug version hash for lbug cache key
  id: lbug-hash
  run: echo "hash=$(grep -A12 '^name = "lbug"$' Cargo.lock | shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"

- name: Restore lbug build artifacts from cache
  uses: actions/cache/restore@v6
  with:
    key: lbug-cache-${{ runner.os }}-${{ steps.rustc-ver.outputs.version }}-${{ steps.lbug-hash.outputs.hash }}-2026-05-29
    path: |
      target/release/build/lbug-*
      target/release/.fingerprint/lbug-*
      target/release/deps/liblbug-*
