<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  {% seo %}
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; color: #1a1a1a; max-width: 860px; margin: 0 auto; padding: 0 1.5rem; }
    header.site-header { border-bottom: 1px solid #ddd; padding: 1rem 0; margin-bottom: 2rem; }
    header.site-header nav a { margin-right: 1rem; color: #0645ad; text-decoration: none; font-size: 0.95rem; }
    header.site-header nav a:hover { text-decoration: underline; }
    pre { background: #f6f8fa; padding: 0.75rem 1rem; overflow-x: auto; border-radius: 4px; }
    code { font-family: "SF Mono", Consolas, Menlo, monospace; font-size: 0.9em; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ddd; padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
    th { background: #f6f8fa; }
    footer.site-footer { border-top: 1px solid #ddd; margin-top: 3rem; padding: 1rem 0; color: #666; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header class="site-header">
    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/getting-started.html' | relative_url }}">Getting Started</a>
      <a href="{{ '/configuration.html' | relative_url }}">Configuration</a>
      <a href="{{ '/ipc-mcp-reference.html' | relative_url }}">IPC &amp; MCP Reference</a>
      <a href="{{ '/telemetry.html' | relative_url }}">Telemetry</a>
      <a href="{{ '/ontology.html' | relative_url }}">Ontology</a>
      <a href="{{ '/operations.html' | relative_url }}">Operations</a>
      <a href="{{ '/testing-and-evaluation.html' | relative_url }}">Testing &amp; Evaluation</a>
      <a href="{{ '/extraction-quality-evaluation.html' | relative_url }}">Extraction Quality</a>
      <a href="{{ '/eval-full-corpus-runbook.html' | relative_url }}">Full-Corpus Runbook</a>
      <a href="{{ '/adr/index.html' | relative_url }}">ADR Index</a>
      <a href="https://github.com/{{ site.repository }}">GitHub</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>
      Documents <code>liminis-context-graph</code> v{{ site.version }}.
      <span id="version-switcher"></span>
      <a href="https://github.com/{{ site.repository }}">Source</a> ·
      <a href="https://github.com/{{ site.repository }}/blob/main/README.md">README</a> ·
      <a href="https://github.com/{{ site.repository }}/issues">Issues</a>
    </p>
  </footer>

  <script>
    // Fetched from a fixed root-relative path, not `relative_url`-filtered: a
    // versioned build's overridden site.baseurl would otherwise resolve this to a
    // per-version copy that doesn't exist -- the manifest only ever lives at root,
    // regenerated by docs-publish-build.sh from what's actually published.
    (function () {
      fetch("/liminis-context-graph/versions.json")
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (data) {
          if (!data || !Array.isArray(data.versions) || data.versions.length === 0) return;

          var container = document.getElementById("version-switcher");
          if (!container) return;

          var select = document.createElement("select");
          select.setAttribute("aria-label", "Switch documented version");

          var latestOption = document.createElement("option");
          latestOption.value = "/liminis-context-graph/";
          latestOption.textContent = "latest (v" + data.versions[0] + ")";
          select.appendChild(latestOption);

          data.versions.forEach(function (v) {
            var opt = document.createElement("option");
            opt.value = "/liminis-context-graph/v" + v + "/";
            opt.textContent = "v" + v;
            if (window.location.pathname.indexOf(opt.value) === 0) {
              opt.selected = true;
            }
            select.appendChild(opt);
          });

          select.addEventListener("change", function () {
            window.location.href = select.value;
          });

          container.appendChild(select);
        })
        .catch(function () { /* versions.json not published yet (e.g. a plain local `jekyll build`) -- no switcher */ });
    })();
  </script>
</body>
</html>
