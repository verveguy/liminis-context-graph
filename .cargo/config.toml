# Workspace-wide cargo configuration.
#
# RUST_TEST_THREADS: lbug mmaps an 8 TB virtual region per Db::open(). On
# macOS the per-process virtual-memory ceiling is lower than on Linux, and
# default cargo-test parallelism (= CPU cores, ~8-16) exhausts it with:
#
#     Lbug(Buffer manager exception: Mmap for size 8796093022208 failed.)
#
# 4 threads is a compromise: keeps the test wall-clock reasonable while
# staying under the macOS VM ceiling. Override with RUST_TEST_THREADS=N for
# faster runs on machines with more VM headroom; set to 1 if 4 still fails.
#
# Note: LBUG_BUILD_FROM_SOURCE was removed when bumping lbug to 0.17.0 and must
# stay unset. The prebuilt archive is a fat bundle that merges the third-party
# static archives (antlr4, fastpfor, parquet, zstd, yyjson, mbedtls, …) into
# liblbug.a via BundleStaticLibrary.cmake. The cmake source-build path causes
# 7399 duplicate-symbol linker errors because link_bundled_deps=true links both
# the fat archive and the individual archives simultaneously. See
# LadybugDB/ladybug-rust#18 for the upstream bug.
#
# The bundle stopped being *fully* self-contained in 0.18.0: OpenSSL moved out
# of the archive (LadybugDB/ladybug#590, "Link against OpenSSL3"). lbug's
# build.rs emits `cargo:rustc-link-lib=dylib=ssl` and `=crypto`
# unconditionally. As of 0.20.1, build.rs checks OPENSSL_DIR / OPENSSL_ROOT_DIR
# first and returns immediately if either is set; otherwise it tries a vcpkg
# lookup, then `pkg-config --variable=libdir openssl` — and that branch does NOT
# return, so it falls through to hardcoded Homebrew probe paths as well.
# Everything else listed above is still statically bundled.
#
# OpenSSL is linked *dynamically* and supplied by the user's package manager, so
# their security updates reach it rather than requiring an lcg release per CVE —
# upstream states the same position in LadybugDB/ladybug#681. What must never
# ship is a binary naming a specific machine's OpenSSL: on macOS a Mach-O records
# the absolute install_name of whatever dylib it linked against. CI and the
# release build therefore run scripts/stage-openssl-rpath.sh, which links against
# dylib copies whose install_name has been rewritten to @rpath and embeds the
# Homebrew ARM / Homebrew Intel / MacPorts roots as LC_RPATH.
# scripts/assert-openssl-linkage.sh enforces it. See ADR-0550. A plain
# `cargo build` without that script bakes in the local Homebrew path, which is
# fine for local development.
#
# LBUG_VERSION pins the prebuilt lbug native bundle to match the `lbug` crate
# (=0.20.1). Without it, lbug's build.rs downloads the *floating* `latest`
# ladybug release, building this crate's FFI against a newer, incompatible
# native bundle. That skew broke the v0.9.0 release: the then-latest 0.18.1
# bundle linked httplib against OpenSSL (`ssl_st`) while the pinned 0.17.0 crate
# expected the bundled mbedtls, and the macOS release build failed with
# `ld: symbol(s) not found` for OpenSSL symbols. Pinning keeps crate and bundle
# in lockstep across dev, CI, and release.
[env]
RUST_TEST_THREADS = "4"
# PKG_CONFIG_PATH must be set HERE, not only exported by
# scripts/stage-openssl-rpath.sh, because `dist build` does not propagate the
# shell environment to build scripts the way a plain `cargo build` does. On a CI
# runner, `cargo build --target aarch64-apple-darwin` produced the correct
# @rpath linkage and `dist build` seconds later — same step, same env vars
# present — baked in the runner's absolute Homebrew path (issue #550). Cargo
# applies this block itself, so dist cannot drop it.
#
# `relative = true` resolves against the workspace root, so this works on any
# machine without knowing the checkout path. The directory is created by
# stage-openssl-rpath.sh; when it does not exist pkg-config simply finds nothing
# here and falls through, which is the correct behaviour for a plain local build.
PKG_CONFIG_PATH = { value = ".openssl-rpath/lib/pkgconfig", relative = true }
LBUG_VERSION = "0.18.1"
