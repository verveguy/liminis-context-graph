# Workspace-wide cargo configuration.
#
# RUST_TEST_THREADS: lbug mmaps an 8 TB virtual region per Db::open(). On
# macOS the per-process virtual-memory ceiling is lower than on Linux, and
# default cargo-test parallelism (= CPU cores, ~8-16) exhausts it with:
#
#     Lbug(Buffer manager exception: Mmap for size 8796093022208 failed.)
#
# 4 threads is a compromise: keeps the test wall-clock reasonable while
# staying under the macOS VM ceiling. Override with RUST_TEST_THREADS=N for
# faster runs on machines with more VM headroom; set to 1 if 4 still fails.
#
# Note: LBUG_BUILD_FROM_SOURCE was removed when bumping lbug to 0.17.0 and must
# stay unset. The prebuilt archive is a fat bundle that merges the third-party
# static archives (antlr4, fastpfor, parquet, zstd, yyjson, mbedtls, …) into
# liblbug.a via BundleStaticLibrary.cmake. The cmake source-build path causes
# 7399 duplicate-symbol linker errors because link_bundled_deps=true links both
# the fat archive and the individual archives simultaneously. See
# LadybugDB/ladybug-rust#18 for the upstream bug.
#
# The bundle stopped being *fully* self-contained in 0.18.0: OpenSSL moved out
# of the archive (LadybugDB/ladybug#590, "Link against OpenSSL3"). lbug's
# build.rs now emits `cargo:rustc-link-lib=dylib=ssl` and `=crypto`
# unconditionally, and consults `pkg-config --variable=libdir openssl` — and
# nothing else — for the search path. Neither OPENSSL_DIR nor OPENSSL_ROOT_DIR
# is read by the published 0.19.1 crate, so PKG_CONFIG_PATH is the only lever.
# Everything else listed above is still statically bundled.
#
# Release artifacts must not inherit a dynamic libssl/libcrypto dependency —
# that would break the self-contained single-binary install story the shell
# installer promises. CI and the release build therefore run
# scripts/stage-openssl-static.sh, which points PKG_CONFIG_PATH at a directory
# holding only libssl.a/libcrypto.a so the linker resolves -lssl/-lcrypto to the
# archives. See ADR-0398. A plain `cargo build` without that script links
# dynamically, which is fine for local development.
#
# LBUG_VERSION pins the prebuilt lbug native bundle to match the `lbug` crate
# (=0.19.1). Without it, lbug's build.rs downloads the *floating* `latest`
# ladybug release, building this crate's FFI against a newer, incompatible
# native bundle. That skew broke the v0.9.0 release: the then-latest 0.18.1
# bundle linked httplib against OpenSSL (`ssl_st`) while the pinned 0.17.0 crate
# expected the bundled mbedtls, and the macOS release build failed with
# `ld: symbol(s) not found` for OpenSSL symbols. Pinning keeps crate and bundle
# in lockstep across dev, CI, and release.
[env]
RUST_TEST_THREADS = "4"
LBUG_VERSION = "0.19.1"
